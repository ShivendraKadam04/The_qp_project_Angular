<div class="appendix-page content-container">
  <div class="appendix-toolbar">
    <a class="appendix-back" routerLink="/quran/dashboard">
      <nz-icon nzType="arrow-left" /> Home
    </a>
    <button *ngIf="isAdmin && !editing && !loading && content" type="button" class="admin-edit" (click)="startEdit()" title="Edit" aria-label="Edit appendix">
      <span nz-icon nzType="edit" nzTheme="outline"></span>
    </button>
  </div>

  <div *ngIf="loading" class="loader-container">
    <nz-spin nzSimple [nzSize]="'large'"></nz-spin>
  </div>

  <app-rich-text-editor
    *ngIf="editing"
    [html]="rawContent"
    [saving]="saving"
    (save)="saveContent($event)"
    (cancel)="cancelEdit()">
  </app-rich-text-editor>

  <article *ngIf="!loading && !editing && content" class="appendix-content" [innerHTML]="content" (click)="onContentClick($event)"></article>

  <div *ngIf="error && !loading && !editing" class="error-message">
    {{ error }}
  </div>
</div>
