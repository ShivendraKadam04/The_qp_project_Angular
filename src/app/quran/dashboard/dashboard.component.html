<div class="dashboard qp-page">
  <!-- ============ Hero ============ -->
  <section class="hero">
    <div class="hero-copy">
      <h1 class="hero-title">The Qur'an Project</h1>
      <p class="hero-tagline">Read, Think and Discover</p>
    </div>

    <a class="hero-card" routerLink="/quran/chapters" aria-label="Open The Qur'an">
      <img src="assets/images/web/qp-main.webp" alt="The Qur'an Project" fetchpriority="high" />
      <div class="hero-card-overlay">
        <h2>The Qur'an <nz-icon nzType="arrow-right" nzTheme="outline" /></h2>
        <span class="tap-to-read">Tap to Read</span>
      </div>
    </a>
  </section>

  <!-- ============ Explore ============ -->
  <section class="explore">
    <button type="button" class="arrow-btn" [disabled]="isAtStart" (click)="scrollLeft()" aria-label="Scroll left">
      <nz-icon nzType="left" nzTheme="outline" />
    </button>

    <div class="explore-track" #scrollWrapper (scroll)="checkScroll()">
      <button
        type="button"
        class="topic-card"
        *ngFor="let item of cards; let first = first"
        [class.featured]="first"
        (click)="navigateToAppendice(item.title)"
      >
        <img [src]="item.image" [alt]="item.title" loading="lazy" decoding="async" />
        <span class="topic-title">{{ item.title }}</span>
      </button>
    </div>

    <button type="button" class="arrow-btn" [disabled]="isAtEnd" (click)="scrollRight()" aria-label="Scroll right">
      <nz-icon nzType="right" nzTheme="outline" />
    </button>
  </section>
</div>
