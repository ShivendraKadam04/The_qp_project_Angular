<div class="app-shell">
  <!-- ============ Sidebar (fixed on desktop, slide-in on tablet / mobile) ============ -->
  <div class="sidebar-overlay" [class.open]="drawerOpen" (click)="drawerOpen = false"></div>
  <aside class="sidebar" [class.open]="drawerOpen" aria-label="Main menu">
    <div class="sidebar-head">
      <a class="sidebar-brand" routerLink="dashboard" aria-label="The Qur'an Project – Home">
        <img src="assets/images/web/white-logo.webp" alt="The Quran Project" width="220" height="33">
      </a>
      <button type="button" class="sidebar-close" (click)="drawerOpen = false" aria-label="Close menu">
        <lucide-icon name="x"></lucide-icon>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section">Explore</div>
      <a routerLink="dashboard" routerLinkActive="active" class="side-link">
        <lucide-icon name="house"></lucide-icon> Home
      </a>
      <a routerLink="chapters" routerLinkActive="active" class="side-link">
        <lucide-icon name="book-open"></lucide-icon> Surahs
      </a>
      <a routerLink="aboutus" routerLinkActive="active" class="side-link">
        <lucide-icon name="users"></lucide-icon> About Us
      </a>
      <a *ngIf="isLoggedIn" routerLink="collection" routerLinkActive="active" class="side-link">
        <lucide-icon name="folder"></lucide-icon> Saved
      </a>
      <a *ngIf="isLoggedIn" routerLink="profile" routerLinkActive="active" class="side-link">
        <lucide-icon name="user"></lucide-icon> Profile
      </a>

      <div class="sidebar-section">More</div>
      <ng-container *ngFor="let link of moreLinks">
        <a *ngIf="link.href" [href]="link.href" target="_blank" rel="noopener noreferrer" class="side-link">
          <lucide-icon [name]="link.icon"></lucide-icon> {{ link.label }}
        </a>
        <a *ngIf="link.route" [routerLink]="link.route" routerLinkActive="active" class="side-link">
          <lucide-icon [name]="link.icon"></lucide-icon> {{ link.label }}
        </a>
        <a *ngIf="link.action === 'newsletter'" class="side-link" role="button" tabindex="0"
           (click)="openNewsletter()" (keydown.enter)="openNewsletter()">
          <lucide-icon [name]="link.icon"></lucide-icon> {{ link.label }}
        </a>
      </ng-container>
    </nav>

    <div class="sidebar-foot">
      <div class="store-badges">
        <a [href]="storeLinks.ios" target="_blank" rel="noopener noreferrer" aria-label="Download on the App Store">
          <img src="assets/images/web/app-store-badge.png" alt="Download on the App Store" width="498" height="150">
        </a>
        <a [href]="storeLinks.android" target="_blank" rel="noopener noreferrer" aria-label="Get it on Google Play">
          <img src="assets/images/web/google-play-badge.png" alt="Get it on Google Play" width="564" height="168">
        </a>
      </div>
      <button type="button" class="side-auth" (click)="logout()">
        <lucide-icon [name]="userRole == null ? 'log-in' : 'log-out'"></lucide-icon>
        {{ userRole == null ? 'Login' : 'Logout' }}
      </button>
    </div>
  </aside>

  <div class="app-content">
    <!-- ============ Header ============ -->
    <header class="app-header">
      <button type="button" class="menu-btn" (click)="drawerOpen = true" aria-label="Open menu">
        <lucide-icon name="menu"></lucide-icon>
      </button>

      <a class="brand" routerLink="dashboard" aria-label="The Qur'an Project – Home">
        <img src="assets/images/web/white-logo.webp" alt="The Quran Project" width="250" height="37">
      </a>

      <!-- Search (single instance; moves to its own row on phones) -->
      <div class="header-search">
        <nz-input-group [nzPrefix]="searchIcon" class="search-group">
          <input
            nz-input
            class="search-input"
            placeholder="Search Surah, Verse, or Text..."
            aria-label="Search the Qur'an"
            [(ngModel)]="searchQuery"
            (ngModelChange)="onSearchChange($event)"
            (focus)="fetchQuranData()"
            [nzAutocomplete]="autoComplete"
          />
        </nz-input-group>
        <ng-template #searchIcon>
          <lucide-icon name="search" class="search-icon"></lucide-icon>
        </ng-template>
        <nz-autocomplete #autoComplete nzOverlayClassName="qp-search-panel">
          <nz-auto-option
            *ngFor="let suggestion of searchSuggestions"
            [nzValue]="suggestion.text"
            (selectionChange)="$event.isUserInput && selectSuggestion(suggestion)"
          >
            {{ suggestion.text }}
          </nz-auto-option>
        </nz-autocomplete>
      </div>

      <div class="header-actions">
        <a class="profile-chip" nz-dropdown nzTrigger="click" [nzDropdownMenu]="profileMenu" nzPlacement="bottomRight">
          <span class="avatar">
            <img *ngIf="userdata?.profilePhoto; else initialsTpl" [src]="file" alt="Profile photo">
            <ng-template #initialsTpl>{{ initials }}</ng-template>
          </span>
          <span class="profile-name">{{ displayName }}</span>
          <lucide-icon name="chevron-down" class="nav-caret"></lucide-icon>
        </a>
      </div>
    </header>

    <!-- ============ Page content ============ -->
    <main class="app-main">
      <div class="page-surface" #pageSurface>
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>

<nz-dropdown-menu #profileMenu="nzDropdownMenu">
  <ul nz-menu>
    <li nz-menu-item routerLink="profile" *ngIf="isLoggedIn" class="menu-row">
      <lucide-icon name="user"></lucide-icon> Profile
    </li>
    <li nz-menu-item (click)="logout()" class="menu-row">
      <lucide-icon [name]="userRole == null ? 'log-in' : 'log-out'"></lucide-icon>
      {{ userRole == null ? 'Login' : 'Logout' }}
    </li>
  </ul>
</nz-dropdown-menu>

<!-- ============ Newsletter modal ============ -->
<nz-modal
  [(nzVisible)]="newsletterOpen"
  nzTitle="Subscribe to our Newsletter"
  [nzFooter]="null"
  [nzCentered]="true"
  [nzWidth]="420"
  (nzOnCancel)="closeNewsletter()">
  <ng-container *nzModalContent>
    <form class="newsletter-form" (ngSubmit)="submitNewsletter()" novalidate>
      <p class="newsletter-text">Enter your email to get updates from The Qur'an Project.</p>
      <input
        nz-input
        type="email"
        name="newsletterEmail"
        autocomplete="email"
        placeholder="your@email.com"
        [(ngModel)]="newsletterEmail"
        [disabled]="newsletterSubmitting" />
      <div class="newsletter-error" *ngIf="newsletterError">{{ newsletterError }}</div>
      <button type="submit" class="qp-btn qp-btn-primary newsletter-submit" [disabled]="newsletterSubmitting">
        <lucide-icon [name]="newsletterSubmitting ? 'loader-circle' : 'mail'" [class.spin]="newsletterSubmitting"></lucide-icon>
        {{ newsletterSubmitting ? 'Subscribing...' : 'Subscribe' }}
      </button>
    </form>
  </ng-container>
</nz-modal>
